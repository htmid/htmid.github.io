<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Living Room Scene — Realistic</title>
<style>
  html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#0e0b08; }
  canvas { display:block; width:100vw; height:100vh; }
  #hud {
    position:fixed; top:16px; left:16px;
    background:rgba(18,14,10,0.82); color:#f1e6d8;
    padding:11px 16px; border-radius:11px;
    font-family:-apple-system,"Segoe UI",Roboto,sans-serif;
    font-size:14px; letter-spacing:.3px;
    border:1px solid rgba(255,255,255,0.08);
    backdrop-filter:blur(8px); pointer-events:none; min-width:220px;
    box-shadow:0 6px 24px rgba(0,0,0,0.4);
  }
  #hud .t { opacity:.55; font-size:12px; margin-top:4px; font-variant-numeric:tabular-nums; }
  #restart {
    position:fixed; bottom:18px; right:18px;
    background:rgba(18,14,10,0.82); color:#f1e6d8;
    border:1px solid rgba(255,255,255,0.14);
    padding:10px 20px; border-radius:11px;
    font-family:-apple-system,"Segoe UI",Roboto,sans-serif;
    font-size:14px; cursor:pointer;
    backdrop-filter:blur(8px); transition:background .15s;
    box-shadow:0 6px 20px rgba(0,0,0,0.4);
  }
  #restart:hover { background:rgba(48,38,28,0.95); }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div id="phase">entering the room…</div>
  <div class="t" id="clock">t = 0.0s</div>
  <div class="t" id="meta"></div>
</div>
<button id="restart">Restart</button>

<script>
(function(){
'use strict';

/* ============================================================
   SETUP
   ============================================================ */
const canvas     = document.getElementById('c');
const ctx        = canvas.getContext('2d');
const phaseLabel = document.getElementById('phase');
const clockLabel = document.getElementById('clock');
const metaLabel  = document.getElementById('meta');
const restartBtn = document.getElementById('restart');

let W = 0, H = 0, DPR = 1;
let VPX = 0, VPY = 0, F = 0;
const CAMH = 1.60;

/* ============================================================
   GLOBAL STATE
   ============================================================ */
let room = null;
let people = [];
let startTime = null;
let sceneEnd  = null;

/* ============================================================
   HELPERS
   ============================================================ */
const clamp = (v,a,b) => v<a?a:v>b?b:v;
const lerp  = (a,b,t) => a+(b-a)*t;
const ease  = t => { t = clamp(t,0,1); return t*t*(3-2*t); };

function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function shade(hex, amt){
  const n = parseInt(hex.slice(1),16);
  const r = clamp(((n>>16)&255) + amt*255, 0, 255)|0;
  const g = clamp(((n>>8)&255)  + amt*255, 0, 255)|0;
  const b = clamp((n&255)       + amt*255, 0, 255)|0;
  return 'rgb('+r+','+g+','+b+')';
}
const pickIn = (r, arr) => arr[(r()*arr.length)|0];
const rndIn  = (r, a, b) => a + r()*(b-a);

/* ============================================================
   PALETTES
   ============================================================ */
const SKINS  = ['#f7dcc2','#f2d0b0','#eec19c','#e0aa80','#d19a6d',
                '#c98f63','#b07a4e','#a9714a','#8d5c38','#77502f',
                '#5f3f26','#4a2e1a','#f4c9a4','#dcae86','#c98a5e'];
const HAIRS  = ['#141010','#1e1712','#2c1f16','#3d2a1a','#4f3520',
                '#5a3d22','#7a5530','#a37b45','#c9a86a','#8e8e8e',
                '#5a5a5a','#3a2a20','#4b2e2a','#6b4a2a','#2a2a30',
                '#d8c8a0','#a05030'];
const SHIRTS = ['#8c3b3b','#3b5a8c','#4a7a55','#8c7a3b','#5a3b8c',
                '#3b8c86','#8c5a3b','#c96a4d','#4d7fc9','#c9a54d',
                '#5fae72','#a35fc9','#c9574d','#6b6b7a','#d8d2c4',
                '#2f3a44','#7a4b6b','#4d6a7a','#b8a58c','#3f4f3a'];
const PANTS  = ['#2b3242','#33383d','#3a3228','#22262e','#44403a',
                '#2e3a2e','#3d2f2f','#1f2429','#4a4238','#2a3040',
                '#3a3a44','#242830','#5a4a3a'];
const SHOES  = ['#1a1a1c','#2a2420','#3a2a20','#22262b','#4a4a4a',
                '#5a4a3a','#1e1e22','#6a3a2a'];

/* ============================================================
   ROOM SCHEMES
   ============================================================ */
const WALL_SCHEMES = [
  { top:'#52412f', mid:'#463626', bot:'#33271c', base:'#2b2118', ceil:'#1d1812',
    trim:'#241b14', sideL:'#2a2018', sideR:'#241c15', sideL2:'#463526', sideR2:'#453626' },
  { top:'#4a4a44', mid:'#3e3e38', bot:'#2c2c28', base:'#262622', ceil:'#1a1a18',
    trim:'#202020', sideL:'#262622', sideR:'#1f1f1b', sideL2:'#3e3e38', sideR2:'#3e3e38' },
  { top:'#3e4a4a', mid:'#354040', bot:'#283030', base:'#222a2a', ceil:'#181e1e',
    trim:'#1e2626', sideL:'#222a2a', sideR:'#1a2222', sideL2:'#354040', sideR2:'#354040' },
  { top:'#4a4040', mid:'#3e3636', bot:'#2e2828', base:'#282222', ceil:'#1a1616',
    trim:'#221a1a', sideL:'#262020', sideR:'#1e1818', sideL2:'#3e3636', sideR2:'#3e3636' },
  { top:'#4a4a3a', mid:'#3e3e30', bot:'#2e2e22', base:'#262620', ceil:'#1a1a14',
    trim:'#22221c', sideL:'#262620', sideR:'#1e1e18', sideL2:'#3e3e30', sideR2:'#3e3e30' },
  { top:'#4a3a4a', mid:'#3e303e', bot:'#2e222e', base:'#261c26', ceil:'#1a121a',
    trim:'#221a22', sideL:'#262026', sideR:'#1e181e', sideL2:'#3e303e', sideR2:'#3e303e' },
];

const FLOOR_SCHEMES = [
  { a:'#4a382a', b:'#5e4832', c:'#7a5a3a' },
  { a:'#3a3228', b:'#4a3e30', c:'#5e4e3a' },
  { a:'#4a3a3a', b:'#5e4a4a', c:'#7a5e5e' },
  { a:'#3a3e3a', b:'#4a504a', c:'#5e665e' },
  { a:'#3e3630', b:'#4e4238', c:'#665444' },
  { a:'#4a3e38', b:'#5e4e42', c:'#7a6650' },
];

const RUG_SCHEMES = [
  { c1:'#8f4642', c2:'#5a2c2c', edge:'#482222', line:'rgba(220,190,150,0.24)' },
  { c1:'#4a5a8f', c2:'#2c3a5a', edge:'#222a48', line:'rgba(190,205,220,0.24)' },
  { c1:'#5a8f46', c2:'#2c5a2c', edge:'#22482a', line:'rgba(200,220,180,0.22)' },
  { c1:'#8f7a46', c2:'#5a4a2c', edge:'#483a22', line:'rgba(230,220,180,0.24)' },
  { c1:'#7a468f', c2:'#4a2c5a', edge:'#382248', line:'rgba(220,190,230,0.22)' },
  { c1:'#46658f', c2:'#2c425a', edge:'#222c48', line:'rgba(190,200,225,0.24)' },
];

const COUCH_SCHEMES = [
  { top:'#4e3e31', front:'#42342a', side:'#352a21', frontDark:'#3a2d24' },
  { top:'#3e3e4e', front:'#343444', side:'#28283a', frontDark:'#2e2e3e' },
  { top:'#4e3e3e', front:'#423434', side:'#352a2a', frontDark:'#3a2d2d' },
  { top:'#3e4e3e', front:'#344234', side:'#2a3528', frontDark:'#2e3a2e' },
  { top:'#4e4e3e', front:'#424234', side:'#353528', frontDark:'#3a3a2e' },
  { top:'#4e4638', front:'#423a2e', side:'#352e24', frontDark:'#3a3228' },
];

/* ============================================================
   PROJECTION
   ============================================================ */
function P(xm, ym, zm){ return [ VPX + F * xm / zm, VPY - F * (ym - CAMH) / zm ]; }
function S(zm){ return F / zm; }

function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = canvas.width  = Math.floor(window.innerWidth  * DPR);
  H = canvas.height = Math.floor(window.innerHeight * DPR);
  canvas.style.width  = window.innerWidth  + 'px';
  canvas.style.height = window.innerHeight + 'px';
  VPX = W * 0.5;
  VPY = H * 0.44;
  const zb = room ? room.ZBACK : 6.0;
  F = (H * 0.69 - VPY) * zb / CAMH;
}
window.addEventListener('resize', resize);

/* ============================================================
   ROOM FACTORY
   ============================================================ */
function makeRoom(){
  const r = mulberry32((Math.random()*1e9)|0);
  const halfW = rndIn(r, 1.95, 2.35);
  const wallH = rndIn(r, 2.55, 2.95);
  const zback = rndIn(r, 5.3, 6.8);
  const doorSide = r() < 0.5 ? -1 : 1;

  return {
    HALF_W: halfW,
    WALL_H: wallH,
    ZBACK:  zback,
    wall:   pickIn(r, WALL_SCHEMES),
    floor:  pickIn(r, FLOOR_SCHEMES),
    rug:    r() < 0.85 ? pickIn(r, RUG_SCHEMES) : null,
    rugR:   rndIn(r, 0.85, 1.10),
    rugZ:   rndIn(r, 2.4, 3.2),
    couch:  pickIn(r, COUCH_SCHEMES),
    couchZ0: rndIn(r, 4.0, 4.5),
    couchZ1: rndIn(r, 5.5, 6.1),
    hasLamp: r() < 0.45,
    hasPlant: r() < 0.40,
    hasPicture: r() < 0.75,
    hasWindow: r() < 0.90,
    doorSide,
    doorX: doorSide * rndIn(r, 1.05, 1.35),
    windowX: -doorSide * rndIn(r, 0.55, 1.15),
    pictureX: rndIn(r, -0.6, 0.6),
  };
}

/* ============================================================
   PEOPLE FACTORY
   ============================================================ */
function makeSpots(n){
  const r = mulberry32((Math.random()*1e9)|0);
  const spots = [];
  const cols = Math.max(2, Math.ceil(Math.sqrt(n * 1.5)));
  const rows = Math.ceil(n / cols);

  const xMin = -room.HALF_W + 0.55;
  const xMax =  room.HALF_W - 1.00;
  const zMin = 2.6;
  const zMax = room.ZBACK - 0.85;

  for (let i = 0; i < n; i++){
    const col = i % cols, row = Math.floor(i / cols);
    const tx = cols > 1 ? col / (cols - 1) : 0.5;
    const tz = rows > 1 ? row / (rows - 1) : 0.5;
    const x = lerp(xMin, xMax, tx) + (r()-0.5) * 0.30;
    const z = lerp(zMax, zMin, tz) + (r()-0.5) * 0.35;
    spots.push({
      xm: clamp(x, xMin, xMax),
      zm: clamp(z, zMin, zMax),
    });
  }
  return spots;
}

function makePeople(){
  const n = 4 + Math.floor(Math.random() * 9);   // 4..12
  const spots = makeSpots(n);
  const out = [];

  for (let i = 0; i < n; i++){
    const r = mulberry32((Math.random()*1e9)|0);
    const pk = arr => arr[(r()*arr.length)|0];

    out.push({
      id: i,
      heightM : 1.52 + r()*0.38,
      build   : 0.82 + r()*0.34,

      skin      : pk(SKINS),
      hairColor : pk(HAIRS),
      hairStyle : (r()*6)|0,
      shirt     : pk(SHIRTS),
      pants     : pk(PANTS),
      shoes     : pk(SHOES),
      sleeve    : r() < 0.55 ? 1 : 0,

      x0: room.doorX + (r()-0.5)*0.40,
      z0: room.ZBACK - 0.15 + (r()-0.5)*0.25,
      x1: spots[i].xm,
      z1: spots[i].zm,

      walkStart : i * (0.40 + r()*0.35),
      seed      : r()*1000,

      nervStart : 0, nervEnd : 0,
      convStart : 0,
      fallStart : 0, fallDur : 0,

      fallDir     : r()<0.5 ? -1 : 1,
      fallRotMax  : 1.30 + r()*0.32,        // ~75°..93° — echt horizontaal
      fallDrop    : 0.02 + r()*0.08,
      fallArm     : 0.55 + r()*0.70,
      fallFore    : 0.30 + r()*0.55,
      fallLeg     : 0.25 + r()*0.45,
      fallTwist   : (r()-0.5) * 0.8,

      vanishStart: Infinity,
      vanishDur  : 0,
    });
  }
  for (const p of out){
    const arrival = p.walkStart + 3.4;
    p.nervStart = arrival + 0.10 + Math.random()*0.45;
    p.nervEnd   = p.nervStart + 0.60 + Math.random()*1.60;
    p.convStart = 6.60 + Math.random()*1.40;
    p.fallStart = p.convStart + 0.70 + 1.90 + Math.random()*2.20;
    p.fallDur   = 1.00 + Math.random()*0.60;
  }
  return out;
}

/* ============================================================
   SCENE INIT / VANISH SCHEDULING
   ============================================================ */
function scheduleVanishes(){
  if (!people.length){ sceneEnd = 0; return; }
  const allDown = Math.max(...people.map(p => p.fallStart + p.fallDur));

  // max 3 min liggen (random 10s .. 180s)
  const LIE_MIN = 10, LIE_MAX = 180;
  const lieWait = LIE_MIN + Math.random() * (LIE_MAX - LIE_MIN);

  const order = people.slice().sort(() => Math.random() - 0.5);
  let vt = allDown + lieWait;
  for (const p of order){
    p.vanishStart = vt;
    p.vanishDur   = 3.0 + Math.random() * 4.0;
    vt += p.vanishDur + 0.4 + Math.random() * 1.6;
  }
  sceneEnd = vt + 2.5;
}

function initScene(){
  room   = makeRoom();
  people = makePeople();
  startTime = null;
  scheduleVanishes();
  resize();
}

/* ============================================================
   QUAD HELPER
   ============================================================ */
function quad(pts, fill){
  ctx.beginPath();
  for (let i=0;i<pts.length;i++){
    const p = pts[i];
    i ? ctx.lineTo(p[0],p[1]) : ctx.moveTo(p[0],p[1]);
  }
  ctx.closePath();
  ctx.fillStyle = fill;
  ctx.fill();
}

/* ============================================================
   ROOM RENDER
   ============================================================ */
function drawRoom(){
  const { HALF_W, WALL_H, ZBACK, wall, floor, rug, couch } = room;
  const zFront = 0.55;

  // Ceiling
  quad([
    P(-HALF_W, WALL_H, ZBACK), P( HALF_W, WALL_H, ZBACK),
    P( HALF_W, WALL_H, zFront), P(-HALF_W, WALL_H, zFront)
  ], wall.ceil);

  // Floor
  ctx.save();
  ctx.beginPath();
  let p = P(-HALF_W,0,ZBACK); ctx.moveTo(p[0],p[1]);
  p = P( HALF_W,0,ZBACK);     ctx.lineTo(p[0],p[1]);
  p = P( HALF_W,0,zFront);    ctx.lineTo(p[0],p[1]);
  p = P(-HALF_W,0,zFront);    ctx.lineTo(p[0],p[1]);
  ctx.closePath();
  ctx.clip();
  const fg = ctx.createLinearGradient(0, VPY + F*CAMH/ZBACK, 0, H);
  fg.addColorStop(0, floor.a);
  fg.addColorStop(0.55, floor.b);
  fg.addColorStop(1, floor.c);
  ctx.fillStyle = fg;
  ctx.fillRect(0,0,W,H);

  ctx.strokeStyle = 'rgba(0,0,0,0.20)';
  ctx.lineWidth = Math.max(1.5, H*0.0018);
  for (let i = -10; i <= 10; i++){
    const xm = i * 0.42;
    const a = P(xm,0,ZBACK);
    const b = P(xm,0,zFront);
    ctx.beginPath(); ctx.moveTo(a[0],a[1]); ctx.lineTo(b[0],b[1]); ctx.stroke();
  }
  ctx.strokeStyle = 'rgba(0,0,0,0.12)';
  ctx.lineWidth = Math.max(1, H*0.0012);
  for (let z = 1.2; z < ZBACK; z += 0.9){
    const a = P(-HALF_W,0,z);
    const b = P( HALF_W,0,z);
    ctx.beginPath(); ctx.moveTo(a[0],a[1]); ctx.lineTo(b[0],b[1]); ctx.stroke();
  }
  ctx.restore();

  // Rug
  if (rug){
    const c  = P(0, 0, room.rugZ);
    const rx = F * room.rugR / room.rugZ;
    const ry = F * (room.rugR * 1.10) / room.rugZ * 0.38;
    ctx.save();
    ctx.beginPath();
    ctx.ellipse(c[0], c[1], rx, ry, 0, 0, Math.PI*2);
    const rg = ctx.createRadialGradient(c[0], c[1]-ry*0.4, 30, c[0], c[1], rx);
    rg.addColorStop(0, rug.c1);
    rg.addColorStop(1, rug.c2);
    ctx.fillStyle = rg; ctx.fill();
    ctx.strokeStyle = rug.edge;
    ctx.lineWidth = Math.max(4, H*0.006); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(c[0], c[1], rx*0.74, ry*0.74, 0, 0, Math.PI*2);
    ctx.strokeStyle = rug.line; ctx.lineWidth = Math.max(3, H*0.004); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(c[0], c[1], rx*0.52, ry*0.52, 0, 0, Math.PI*2);
    ctx.strokeStyle = rug.line; ctx.lineWidth = Math.max(2, H*0.003); ctx.stroke();
    ctx.restore();
  }

  // Back wall
  ctx.save();
  ctx.beginPath();
  p = P(-HALF_W,0,ZBACK);       ctx.moveTo(p[0],p[1]);
  p = P( HALF_W,0,ZBACK);       ctx.lineTo(p[0],p[1]);
  p = P( HALF_W,WALL_H,ZBACK);  ctx.lineTo(p[0],p[1]);
  p = P(-HALF_W,WALL_H,ZBACK);  ctx.lineTo(p[0],p[1]);
  ctx.closePath(); ctx.clip();
  const wg = ctx.createLinearGradient(0, P(0,WALL_H,ZBACK)[1], 0, P(0,0,ZBACK)[1]);
  wg.addColorStop(0, wall.top);
  wg.addColorStop(0.55, wall.mid);
  wg.addColorStop(1, wall.bot);
  ctx.fillStyle = wg;
  ctx.fillRect(0,0,W,H);
  ctx.restore();

  // Left wall
  (function(){
    ctx.beginPath();
    p = P(-HALF_W,WALL_H,ZBACK);  ctx.moveTo(p[0],p[1]);
    p = P(-HALF_W,0,ZBACK);       ctx.lineTo(p[0],p[1]);
    p = P(-HALF_W,0,zFront);      ctx.lineTo(p[0],p[1]);
    p = P(-HALF_W,WALL_H,zFront); ctx.lineTo(p[0],p[1]);
    ctx.closePath();
    const lg = ctx.createLinearGradient(0,0,W*0.35,0);
    lg.addColorStop(0, wall.sideL);
    lg.addColorStop(1, wall.sideL2);
    ctx.fillStyle = lg; ctx.fill();
  })();

  // Right wall
  (function(){
    ctx.beginPath();
    p = P(HALF_W,WALL_H,ZBACK);  ctx.moveTo(p[0],p[1]);
    p = P(HALF_W,0,ZBACK);       ctx.lineTo(p[0],p[1]);
    p = P(HALF_W,0,zFront);      ctx.lineTo(p[0],p[1]);
    p = P(HALF_W,WALL_H,zFront); ctx.lineTo(p[0],p[1]);
    ctx.closePath();
    const rg = ctx.createLinearGradient(W,0,W*0.65,0);
    rg.addColorStop(0, wall.sideR);
    rg.addColorStop(1, wall.sideR2);
    ctx.fillStyle = rg; ctx.fill();
  })();

  // Crown moulding
  const cmH = 0.10;
  quad([
    P(-HALF_W, WALL_H,       ZBACK),
    P( HALF_W, WALL_H,       ZBACK),
    P( HALF_W, WALL_H-cmH,   ZBACK),
    P(-HALF_W, WALL_H-cmH,   ZBACK)
  ], wall.trim);

  // Baseboard back
  const bbH = 0.13;
  quad([
    P(-HALF_W, bbH, ZBACK), P( HALF_W, bbH, ZBACK),
    P( HALF_W, 0,   ZBACK), P(-HALF_W, 0,   ZBACK)
  ], wall.base);

  // Baseboard sides
  ctx.fillStyle = wall.base;
  ctx.beginPath();
  p = P(-HALF_W, bbH, ZBACK);  ctx.moveTo(p[0],p[1]);
  p = P(-HALF_W, 0,   ZBACK);  ctx.lineTo(p[0],p[1]);
  p = P(-HALF_W, 0,   zFront); ctx.lineTo(p[0],p[1]);
  p = P(-HALF_W, bbH, zFront); ctx.lineTo(p[0],p[1]);
  ctx.closePath(); ctx.fill();
  ctx.beginPath();
  p = P(HALF_W, bbH, ZBACK);   ctx.moveTo(p[0],p[1]);
  p = P(HALF_W, 0,   ZBACK);   ctx.lineTo(p[0],p[1]);
  p = P(HALF_W, 0,   zFront);  ctx.lineTo(p[0],p[1]);
  p = P(HALF_W, bbH, zFront);  ctx.lineTo(p[0],p[1]);
  ctx.closePath(); ctx.fill();

  // Window
  if (room.hasWindow){
    const wx = room.windowX, wy0 = 0.95, wy1 = 2.30, ww = 0.62;
    const a = P(wx - ww, wy1, ZBACK);
    const b = P(wx + ww, wy0, ZBACK);
    const x = a[0], y = a[1], w = b[0]-a[0], h = b[1]-a[1];
    ctx.fillStyle = wall.base;
    ctx.fillRect(x-11, y-11, w+22, h+22);
    const wgd = ctx.createLinearGradient(x, y, x, y+h);
    wgd.addColorStop(0,   '#7ba3c6');
    wgd.addColorStop(0.5, '#4a7192');
    wgd.addColorStop(1,   '#263e54');
    ctx.fillStyle = wgd; ctx.fillRect(x, y, w, h);
    const gl = ctx.createLinearGradient(x, y, x, y+h);
    gl.addColorStop(0, 'rgba(255,238,195,0.42)');
    gl.addColorStop(1, 'rgba(255,238,195,0)');
    ctx.fillStyle = gl; ctx.fillRect(x, y, w, h);
    ctx.strokeStyle = wall.trim;
    ctx.lineWidth = 8; ctx.strokeRect(x, y, w, h);
    ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.moveTo(x + w*0.50, y); ctx.lineTo(x + w*0.50, y+h);
    ctx.moveTo(x, y + h*0.42); ctx.lineTo(x+w, y + h*0.42);
    ctx.stroke();
    ctx.fillStyle = shade(wall.trim, 0.10);
    ctx.fillRect(x-16, y+h+8, w+32, 11);
  }

  // Door
  (function(){
    const dx = room.doorX;
    const dx0 = dx - 0.48, dx1 = dx + 0.48, dy1 = 2.10;
    const a = P(dx0, dy1, ZBACK);
    const b = P(dx1, 0,   ZBACK);
    const x = a[0], y = a[1], w = b[0]-a[0], h = b[1]-a[1];
    ctx.fillStyle = '#1a130e';
    ctx.fillRect(x-13, y-13, w+26, h+13);
    const dg = ctx.createLinearGradient(x, y, x+w, y);
    dg.addColorStop(0,   '#140f0c');
    dg.addColorStop(0.5, '#241b14');
    dg.addColorStop(1,   '#140f0c');
    ctx.fillStyle = dg;
    ctx.fillRect(x, y, w, h);
    ctx.strokeStyle = 'rgba(255,255,255,0.045)';
    ctx.lineWidth = 2.5;
    ctx.strokeRect(x + w*0.16, y + h*0.07, w*0.68, h*0.35);
    ctx.strokeRect(x + w*0.16, y + h*0.53, w*0.68, h*0.40);
    ctx.fillStyle = '#b8934f';
    ctx.beginPath(); ctx.arc(x + w*0.87, y + h*0.55, 7, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = 'rgba(255,235,180,0.55)';
    ctx.beginPath(); ctx.arc(x + w*0.87 - 1.5, y + h*0.55 - 1.5, 2.4, 0, Math.PI*2); ctx.fill();
  })();

  // Picture
  if (room.hasPicture){
    const a = P(room.pictureX - 0.34, 1.95, ZBACK);
    const b = P(room.pictureX + 0.34, 1.30, ZBACK);
    const x = a[0], y = a[1], w = b[0]-a[0], h = b[1]-a[1];
    ctx.fillStyle = wall.trim;
    ctx.fillRect(x-8, y-8, w+16, h+16);
    ctx.fillStyle = shade(wall.base, 0.15);
    ctx.fillRect(x-3, y-3, w+6, h+6);
    const pg = ctx.createLinearGradient(x, y, x, y+h);
    pg.addColorStop(0, '#8a7c62');
    pg.addColorStop(1, '#5a4f3c');
    ctx.fillStyle = pg;
    ctx.fillRect(x, y, w, h);
    ctx.fillStyle = 'rgba(180,120,90,0.55)';
    ctx.beginPath(); ctx.ellipse(x + w*0.42, y + h*0.55, w*0.22, h*0.30, 0.3, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = 'rgba(90,110,130,0.45)';
    ctx.beginPath(); ctx.ellipse(x + w*0.66, y + h*0.42, w*0.16, h*0.22, -0.2, 0, Math.PI*2); ctx.fill();
  }

  // Couch
  (function(){
    const co = couch;
    const z0 = room.couchZ0, z1 = room.couchZ1;
    const xBack = HALF_W - 0.02;
    const xArm  = HALF_W - 0.90;

    function box(x0,x1,y0,y1,z0,z1, top, front, side){
      quad([P(x0,y1,z0),P(x1,y1,z0),P(x1,y1,z1),P(x0,y1,z1)], top);
      quad([P(x0,y0,z0),P(x1,y0,z0),P(x1,y1,z0),P(x0,y1,z0)], front);
      quad([P(x0,y0,z0),P(x0,y0,z1),P(x0,y1,z1),P(x0,y1,z0)], side);
    }
    box(xBack-0.30, xBack, 0.40, 0.92, z0, z1, co.top, co.frontDark, co.side);
    box(xArm, xBack, 0.00, 0.40, z0, z1, co.top, co.front, co.side);
    box(xArm+0.05, xBack-0.30, 0.40, 0.47, z0+0.08, (z0+z1)/2 - 0.03, co.top, co.front, co.side);
    box(xArm+0.05, xBack-0.30, 0.40, 0.47, (z0+z1)/2 + 0.03, z1-0.08, co.top, co.front, co.side);
    box(xArm, xBack, 0.40, 0.63, z0, z0+0.32, co.top, co.front, co.side);
    box(xArm, xBack, 0.40, 0.63, z1-0.32, z1, co.top, co.front, co.side);
  })();

  // Floor lamp
  if (room.hasLamp){
    const lx = -HALF_W + 0.42, lz = room.ZBACK - 0.65;
    const baseP = P(lx, 0, lz);
    const topP  = P(lx, 1.55, lz);
    ctx.strokeStyle = '#3a3028';
    ctx.lineWidth = Math.max(3, H*0.004);
    ctx.beginPath(); ctx.moveTo(baseP[0], baseP[1]); ctx.lineTo(topP[0], topP[1]); ctx.stroke();
    ctx.fillStyle = '#2a221a';
    ctx.beginPath(); ctx.ellipse(baseP[0], baseP[1], H*0.018, H*0.006, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = 'rgba(255,220,160,0.70)';
    ctx.beginPath(); ctx.ellipse(topP[0], topP[1] - H*0.01, H*0.028, H*0.018, 0, 0, Math.PI*2); ctx.fill();
    const shadeTop = P(lx, 1.72, lz);
    ctx.fillStyle = 'rgba(60,48,38,0.95)';
    ctx.beginPath();
    ctx.moveTo(topP[0] - H*0.030, topP[1] + H*0.005);
    ctx.lineTo(topP[0] + H*0.030, topP[1] + H*0.005);
    ctx.lineTo(topP[0] + H*0.018, shadeTop[1]);
    ctx.lineTo(topP[0] - H*0.018, shadeTop[1]);
    ctx.closePath(); ctx.fill();
  }

  // Plant
  if (room.hasPlant){
    const px = HALF_W - 0.45, pz = room.ZBACK - 0.45;
    const bp = P(px, 0.32, pz);
    ctx.fillStyle = '#5a3e2a';
    ctx.beginPath(); ctx.ellipse(bp[0], bp[1], H*0.032, H*0.010, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#3a2820';
    ctx.beginPath();
    ctx.moveTo(bp[0] - H*0.032, bp[1]);
    ctx.lineTo(bp[0] + H*0.032, bp[1]);
    ctx.lineTo(bp[0] + H*0.024, bp[1] + H*0.030);
    ctx.lineTo(bp[0] - H*0.024, bp[1] + H*0.030);
    ctx.closePath(); ctx.fill();
    for (let i = 0; i < 7; i++){
      const ang = (i/7) * Math.PI * 2;
      const lp = P(px + Math.cos(ang)*0.10, 0.75 + Math.sin(i*1.7)*0.15, pz + Math.sin(ang)*0.10);
      ctx.fillStyle = 'rgba(60,110,60,0.85)';
      ctx.beginPath(); ctx.ellipse(lp[0], lp[1], H*0.016, H*0.030, ang*0.3, 0, Math.PI*2); ctx.fill();
    }
  }

  // AO at wall/floor
  (function(){
    const a = P(0,0,ZBACK);
    const ao = ctx.createLinearGradient(0, a[1]-H*0.06, 0, a[1]+H*0.03);
    ao.addColorStop(0, 'rgba(0,0,0,0)');
    ao.addColorStop(1, 'rgba(0,0,0,0.50)');
    ctx.fillStyle = ao;
    ctx.fillRect(0, a[1]-H*0.06, W, H*0.09);
  })();

  // Window light on floor
  (function(){
    const c = P(room.windowX + 0.3, 0, 3.2);
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const lg = ctx.createRadialGradient(c[0], c[1], 20, c[0], c[1], F*1.6);
    lg.addColorStop(0, 'rgba(255,215,150,0.13)');
    lg.addColorStop(1, 'rgba(255,215,150,0)');
    ctx.fillStyle = lg;
    ctx.fillRect(0, VPY, W, H-VPY);
    ctx.restore();
  })();

  // Vignette
  (function(){
    const vg = ctx.createRadialGradient(W*0.5, H*0.5, Math.min(W,H)*0.28,
                                          W*0.5, H*0.5, Math.max(W,H)*0.72);
    vg.addColorStop(0, 'rgba(0,0,0,0)');
    vg.addColorStop(1, 'rgba(0,0,0,0.52)');
    ctx.fillStyle = vg;
    ctx.fillRect(0,0,W,H);
  })();
}

/* ============================================================
   FIGURE — local units 1 = person height, feet at (0,0)
   ============================================================ */

function drawLeg(hipX, hipY, swing, lift, fa, p, side){
  const thighLen = 0.230, shinLen = 0.245;
  const B = p.build;

  const thighAng = swing * 0.20 - lift * 0.10 + fa * side * p.fallLeg;
  const kneeBend = lift * 0.95 + fa * (0.55 + p.fallLeg);

  const kneeX = hipX + Math.sin(thighAng) * thighLen;
  const kneeY = hipY + Math.cos(thighAng) * thighLen;

  const shinAng = thighAng - kneeBend;
  const ankleX = kneeX + Math.sin(shinAng) * shinLen;
  const ankleY = kneeY + Math.cos(shinAng) * shinLen;

  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.strokeStyle = p.pants;
  ctx.lineWidth = 0.075 * B;
  ctx.beginPath();
  ctx.moveTo(hipX, hipY);
  ctx.lineTo(kneeX, kneeY);
  ctx.lineTo(ankleX, ankleY);
  ctx.stroke();

  const footAng = shinAng * 0.4;
  ctx.save();
  ctx.translate(ankleX, ankleY);
  ctx.rotate(footAng);
  ctx.fillStyle = p.shoes;
  ctx.beginPath();
  ctx.ellipse(side * 0.008, 0.010, 0.032, 0.016, 0, 0, Math.PI*2);
  ctx.fill();
  ctx.restore();
}

function drawArm(shoX, shoY, side, swing, sh, fa, p, t){
  const upperLen = 0.205, foreLen = 0.185;
  const B = p.build, s = p.seed;

  const upperAng =
      side * 0.14
    + side * Math.abs(swing) * 0.10
    + side * sh * 0.30 * Math.sin(t*19 + side*2.1 + s)
    + fa * side * p.fallArm;

  const elbX = shoX + Math.sin(upperAng) * upperLen;
  const elbY = shoY + Math.cos(upperAng) * upperLen;

  const foreAng = upperAng
    + side * 0.20
    + side * sh * 0.40 * Math.sin(t*23 + side*3.3 + s*1.7)
    + fa * side * p.fallFore;

  const wriX = elbX + Math.sin(foreAng) * foreLen;
  const wriY = elbY + Math.cos(foreAng) * foreLen;

  ctx.strokeStyle = shade(p.shirt, -0.03);
  ctx.lineWidth = 0.042 * B;          // slightly slimmer upper arm
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(shoX, shoY + 0.008);
  ctx.lineTo(elbX, elbY);
  ctx.stroke();

  if (p.sleeve){
    ctx.strokeStyle = p.skin;
    ctx.lineWidth = 0.032 * B;
  } else {
    ctx.strokeStyle = shade(p.shirt, -0.03);
    ctx.lineWidth = 0.038 * B;
  }
  ctx.beginPath();
  ctx.moveTo(elbX, elbY);
  ctx.lineTo(wriX, wriY);
  ctx.stroke();

  drawHand(wriX, wriY, foreAng, side, sh, fa, p, t, s);
}

function drawHand(x, y, angle, side, sh, fa, p, t, seed){
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(angle);
  ctx.fillStyle = p.skin;

  ctx.beginPath();
  ctx.ellipse(0, 0.014, 0.016, 0.021, 0, 0, Math.PI*2);
  ctx.fill();

  const wigAmt = 0.0012 + sh * 0.006 + fa * 0.004;
  const spread = 0.0072;
  for (let i = 0; i < 4; i++){
    const fx = (i - 1.5) * spread;
    const baseLen = 0.011 - Math.abs(i-1.5) * 0.0015;
    const wig = Math.sin(t*3.1 + i*1.7 + seed) * wigAmt;
    const curl = fa * 0.006 * (1 + (i%2));
    ctx.beginPath();
    ctx.ellipse(fx + wig*0.4, 0.030 + baseLen*0.5 + wig - curl,
                0.0040, baseLen + wig, 0, 0, Math.PI*2);
    ctx.fill();
  }

  ctx.beginPath();
  ctx.ellipse(side * 0.020, 0.008 + Math.sin(t*2.7 + seed)*wigAmt,
              0.0048, 0.0092, side * 0.55, 0, Math.PI*2);
  ctx.fill();

  ctx.restore();
}

function drawHairBack(p, cx, cy, rx, ry){
  ctx.fillStyle = p.hairColor;
  const st = p.hairStyle;
  if (st === 1){
    ctx.beginPath();
    ctx.moveTo(cx - rx*1.15, cy - ry*0.30);
    ctx.quadraticCurveTo(cx - rx*2.00, cy + ry*1.70, cx - rx*1.10, cy + ry*3.40);
    ctx.lineTo(cx + rx*1.10, cy + ry*3.40);
    ctx.quadraticCurveTo(cx + rx*2.00, cy + ry*1.70, cx + rx*1.15, cy - ry*0.30);
    ctx.closePath(); ctx.fill();
  } else if (st === 4){
    ctx.beginPath(); ctx.arc(cx, cy - ry*0.14, rx*1.55, 0, Math.PI*2); ctx.fill();
  } else if (st === 2){
    ctx.beginPath(); ctx.arc(cx + rx*0.15, cy - ry*1.32, rx*0.60, 0, Math.PI*2); ctx.fill();
  } else if (st === 3){
    ctx.beginPath();
    ctx.moveTo(cx + rx*0.55, cy - ry*0.55);
    ctx.quadraticCurveTo(cx + rx*2.35, cy + ry*0.35, cx + rx*1.50, cy + ry*2.35);
    ctx.quadraticCurveTo(cx + rx*1.15, cy + ry*1.10, cx + rx*0.70, cy + ry*0.15);
    ctx.closePath(); ctx.fill();
  }
}

function drawHairFront(p, cx, cy, rx, ry){
  ctx.fillStyle = p.hairColor;
  const st = p.hairStyle;
  if (st === 5){
    ctx.beginPath();
    ctx.ellipse(cx, cy - ry*0.68, rx*0.96, ry*0.42, 0, Math.PI, Math.PI*2); ctx.fill();
    ctx.beginPath();
    ctx.ellipse(cx - rx*0.95, cy - ry*0.10, rx*0.22, ry*0.42, 0, 0, Math.PI*2);
    ctx.ellipse(cx + rx*0.95, cy - ry*0.10, rx*0.22, ry*0.42, 0, 0, Math.PI*2);
    ctx.fill();
  } else if (st === 4){
    ctx.beginPath();
    ctx.ellipse(cx, cy - ry*0.34, rx*1.10, ry*0.72, 0, Math.PI, Math.PI*2); ctx.fill();
  } else if (st === 1){
    ctx.beginPath();
    ctx.ellipse(cx, cy - ry*0.40, rx*1.08, ry*0.64, 0, Math.PI, Math.PI*2); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(cx - rx*1.08, cy - ry*0.30);
    ctx.quadraticCurveTo(cx - rx*0.4, cy - ry*0.05, cx + rx*1.05, cy - ry*0.42);
    ctx.lineTo(cx + rx*1.05, cy - ry*0.70);
    ctx.quadraticCurveTo(cx, cy - ry*1.15, cx - rx*1.05, cy - ry*0.70);
    ctx.closePath(); ctx.fill();
  } else {
    ctx.beginPath();
    ctx.ellipse(cx, cy - ry*0.40, rx*1.07, ry*0.63, 0, Math.PI, Math.PI*2); ctx.fill();
  }
}

function drawFace(p, t, cx, cy, rx, ry){
  const eyeY  = cy + ry*0.03;
  const eyeDX = rx * 0.42;
  const eRx   = rx * 0.20;
  const eRy   = ry * 0.13;

  const blinkT = (t * 0.65 + p.seed * 0.13) % 3.7;
  const blinking = blinkT < 0.09;

  if (blinking){
    ctx.strokeStyle = shade(p.skin, -0.38);
    ctx.lineWidth = rx * 0.10;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(cx - eyeDX - eRx, eyeY); ctx.lineTo(cx - eyeDX + eRx, eyeY);
    ctx.moveTo(cx + eyeDX - eRx, eyeY); ctx.lineTo(cx + eyeDX + eRx, eyeY);
    ctx.stroke();
  } else {
    ctx.fillStyle = '#f6f1ea';
    ctx.beginPath(); ctx.ellipse(cx - eyeDX, eyeY, eRx, eRy, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(cx + eyeDX, eyeY, eRx, eRy, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#4a3524';
    ctx.beginPath(); ctx.arc(cx - eyeDX, eyeY, eRx*0.62, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx + eyeDX, eyeY, eRx*0.62, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#150f0b';
    ctx.beginPath(); ctx.arc(cx - eyeDX, eyeY, eRx*0.30, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx + eyeDX, eyeY, eRx*0.30, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.88)';
    ctx.beginPath(); ctx.arc(cx - eyeDX + eRx*0.22, eyeY - eRy*0.30, eRx*0.13, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx + eyeDX + eRx*0.22, eyeY - eRy*0.30, eRx*0.13, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = 'rgba(40,25,15,0.55)';
    ctx.lineWidth = rx * 0.055;
    ctx.beginPath();
    ctx.arc(cx - eyeDX, eyeY, eRx, Math.PI*1.08, Math.PI*1.92);
    ctx.arc(cx + eyeDX, eyeY, eRx, Math.PI*1.08, Math.PI*1.92);
    ctx.stroke();
  }

  ctx.strokeStyle = p.hairColor;
  ctx.lineWidth = rx * 0.11;
  ctx.lineCap = 'round';
  const bY = eyeY - ry * 0.38;
  ctx.beginPath();
  ctx.moveTo(cx - eyeDX - eRx*1.10, bY + ry*0.03);
  ctx.lineTo(cx - eyeDX + eRx*0.95, bY - ry*0.05);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(cx + eyeDX + eRx*1.10, bY + ry*0.03);
  ctx.lineTo(cx + eyeDX - eRx*0.95, bY - ry*0.05);
  ctx.stroke();

  ctx.strokeStyle = shade(p.skin, -0.18);
  ctx.lineWidth = rx * 0.08;
  ctx.beginPath();
  ctx.moveTo(cx, eyeY + ry*0.14);
  ctx.lineTo(cx, eyeY + ry*0.36);
  ctx.stroke();

  ctx.strokeStyle = shade(p.skin, -0.32);
  ctx.lineWidth = rx * 0.10;
  ctx.beginPath();
  ctx.arc(cx, eyeY + ry*0.26, rx*0.32, Math.PI*0.22, Math.PI*0.78);
  ctx.stroke();

  ctx.fillStyle = 'rgba(0,0,0,0.06)';
  ctx.beginPath();
  ctx.ellipse(cx, cy + ry*0.72, rx*0.42, ry*0.14, 0, 0, Math.PI*2);
  ctx.fill();
}

function drawFigure(p, t, st){
  const skin = p.skin;
  const B    = p.build;
  const s    = p.seed;

  /* walk */
  const walkP  = st.phase;
  const walkAmt = st.walkAmt;
  const walking = st.walking;

  const fwdL  = walking ?  Math.cos(walkP) * walkAmt : 0;
  const fwdR  = walking ? -Math.cos(walkP) * walkAmt : 0;
  const liftL = walking ? Math.max(0, -Math.sin(walkP)) * walkAmt : 0;
  const liftR = walking ? Math.max(0,  Math.sin(walkP)) * walkAmt : 0;

  const bob   = walking ? Math.abs(Math.sin(walkP)) * 0.012 * walkAmt : 0;
  const sway  = walking ? Math.sin(walkP) * 0.010 * walkAmt : 0;

  /* shake */
  const sh  = st.shake;
  const shT = t * 26;

  const shX = (Math.sin(shT*1.10 + s)      * 0.011
             + Math.sin(shT*2.30 + s*1.7)  * 0.005) * sh;
  const shY = (Math.cos(shT*0.93 + s*0.9)  * 0.009
             + Math.sin(shT*3.10 + s*2.1)  * 0.004) * sh;

  /* idle life — subtle breathing and weight shift */
  const idle = st.idleAmt;
  const breathe = Math.sin(t * 1.05 + s * 1.7) * 0.0035 * idle;
  const sway2   = Math.sin(t * 0.42 + s * 0.9) * 0.0045 * idle;
  const headBob = Math.sin(t * 1.3 + s * 1.1) * 0.0022
                + Math.sin(t * 0.7 + s * 2.3) * 0.0016;

  const fa = st.fall;

  /* skeleton */
  const hipY = -0.505 - bob + breathe * 0.4;
  const shoY = -0.815 - bob + breathe;
  const hipX = sway + shX * 0.5 + sway2 * 0.6;
  const shoX = sway * 0.6 + shX + sway2;

  const headRY = 0.068;
  const headRX = 0.048;
  const headCX = sway * 0.4 + shX * 1.6 + headBob * 3;
  const headCY = -0.932 - bob + shY + headBob * 2 + breathe;

  const hipHalf = 0.052 * B;
  const shoHalf = 0.082 * B;   // 👈 smaller than before

  ctx.save();

  /* fall transform */
  if (fa > 0){
    ctx.translate(0, fa * p.fallDrop);
    const wobble = Math.sin(fa * Math.PI * 5) * 0.06 * (1 - fa);
    ctx.rotate(fa * p.fallRotMax * p.fallDir + wobble);
  }

  drawHairBack(p, headCX, headCY, headRX, headRY);

  drawLeg(-hipHalf + hipX, hipY, fwdL, liftL, fa, p, -1);
  drawLeg( hipHalf + hipX, hipY, fwdR, liftR, fa, p,  1);

  /* neck */
  const neckHalf = 0.026 * B;
  ctx.fillStyle = shade(skin, -0.14);
  ctx.beginPath();
  ctx.moveTo(shoX - neckHalf, shoY + 0.008);
  ctx.lineTo(headCX - neckHalf*0.9, headCY + headRY*0.55);
  ctx.lineTo(headCX + neckHalf*0.9, headCY + headRY*0.55);
  ctx.lineTo(shoX + neckHalf, shoY + 0.008);
  ctx.closePath();
  ctx.fill();

  /* torso — improved silhouette with sloped trapezius */
  const waistY    = -0.610;
  const waistHalf = 0.070 * B;
  const shoulderDrop = 0.012;

  const tg = ctx.createLinearGradient(0, shoY, 0, hipY);
  tg.addColorStop(0,    shade(p.shirt,  0.08));
  tg.addColorStop(0.55, p.shirt);
  tg.addColorStop(1,    shade(p.shirt, -0.18));
  ctx.fillStyle = tg;

  ctx.beginPath();
  // left outer shoulder
  ctx.moveTo(shoX - shoHalf, shoY + shoulderDrop);
  // left side down to hip
  ctx.quadraticCurveTo(shoX - shoHalf*0.92, (shoY + hipY) * 0.5, hipX - hipHalf, hipY);
  // hips across
  ctx.lineTo(hipX + hipHalf, hipY);
  // right side up
  ctx.quadraticCurveTo(shoX + shoHalf*0.92, (shoY + hipY) * 0.5, shoX + shoHalf, shoY + shoulderDrop);
  // right shoulder slope toward neck
  ctx.quadraticCurveTo(shoX + shoHalf*0.55, shoY - 0.006, shoX + neckHalf*0.9, shoY - 0.010);
  // neck base
  ctx.lineTo(shoX - neckHalf*0.9, shoY - 0.010);
  // left slope back to outer shoulder
  ctx.quadraticCurveTo(shoX - shoHalf*0.55, shoY - 0.006, shoX - shoHalf, shoY + shoulderDrop);
  ctx.closePath();
  ctx.fill();

  // subtle chest highlight
  ctx.fillStyle = 'rgba(255,255,255,0.04)';
  ctx.beginPath();
  ctx.ellipse(shoX - shoHalf * 0.35, shoY + 0.03, shoHalf * 0.5, 0.045, 0.2, 0, Math.PI*2);
  ctx.fill();

  /* arms */
  const armSw = walking ? Math.sin(walkP) * 0.35 * walkAmt : 0;
  drawArm(shoX - shoHalf + 0.004, shoY + 0.012, -1,  armSw, sh, fa, p, t);
  drawArm(shoX + shoHalf - 0.004, shoY + 0.012,  1, -armSw, sh, fa, p, t);

  /* head */
  const hg = ctx.createRadialGradient(
    headCX - headRX*0.35, headCY - headRY*0.35, headRX*0.08,
    headCX,               headCY,               headRY*1.35);
  hg.addColorStop(0, shade(skin,  0.09));
  hg.addColorStop(1, shade(skin, -0.10));
  ctx.fillStyle = hg;
  ctx.beginPath();
  ctx.ellipse(headCX, headCY, headRX, headRY, 0, 0, Math.PI*2);
  ctx.fill();

  ctx.fillStyle = shade(skin, -0.06);
  ctx.beginPath();
  ctx.ellipse(headCX - headRX*0.98, headCY + headRY*0.05, headRX*0.14, headRY*0.22, 0, 0, Math.PI*2);
  ctx.ellipse(headCX + headRX*0.98, headCY + headRY*0.05, headRX*0.14, headRY*0.22, 0, 0, Math.PI*2);
  ctx.fill();

  drawFace(p, t, headCX, headCY, headRX, headRY);
  drawHairFront(p, headCX, headCY, headRX, headRY);

  ctx.restore();
}

/* ============================================================
   PERSON STATE
   ============================================================ */
const WALK_DURATION = 3.40;
const WALK_CYCLES   = 4.00;

function personState(p, t){
  const u = (t - p.walkStart) / WALK_DURATION;
  const walking = u > 0 && u < 1;

  let phase = 0, walkAmt = 1;
  if (walking){
    const eu = ease(clamp(u, 0, 1));
    phase = eu * Math.PI * 2 * WALK_CYCLES;
    if (u > 0.85) walkAmt = 1 - ease((u - 0.85) / 0.15);
  } else if (u >= 1){
    walkAmt = 0;
  } else {
    walkAmt = 0;
  }

  const eu = ease(clamp(u, 0, 1));
  const xm = lerp(p.x0, p.x1, eu);
  const zm = lerp(p.z0, p.z1, eu);

  // idle amount: 1 when standing still after arriving, 0 during walk/fall
  const arrived = u >= 1;
  let idleAmt = arrived ? 1 : 0;

  // nervous jitter
  let nervous = 0;
  if (t > p.nervStart && t < p.nervEnd){
    const a = clamp((t - p.nervStart) / 0.30, 0, 1);
    const b = clamp((p.nervEnd - t)      / 0.30, 0, 1);
    nervous = Math.min(a, b);
  }

  // convulsion + fall
  let shake = 0, fall = 0;
  if (t > p.convStart){
    const cs = t - p.convStart;
    const RAMP = 0.70;
    if (cs < RAMP){
      shake = ease(cs / RAMP) * 0.55;
    } else if (t < p.fallStart){
      const dur = Math.max(0.01, p.fallStart - p.convStart - RAMP);
      shake = 0.55 + 0.45 * ease((cs - RAMP) / dur);
    } else {
      const ft = (t - p.fallStart) / p.fallDur;
      if (ft < 1){
        fall  = ease(ft);
        shake = Math.max(0, 1 - ft * 1.7);
      } else {
        fall  = 1;
        shake = 0;
      }
    }
  }

  const totalShake = Math.max(shake, nervous * 0.35);

  // vanish / flicker
  let flickerT = 0, gone = false;
  if (t > p.vanishStart){
    const vt = t - p.vanishStart;
    if (vt >= p.vanishDur){
      gone = true;
    } else {
      flickerT = vt;
      idleAmt = 0;
    }
  }

  return {
    walking, phase, walkAmt, xm, zm,
    shake: totalShake, fall,
    idleAmt,
    flickerT, gone,
  };
}

function drawPerson(p, t, st){
  if (st.gone) return;
  const appear = clamp((t - p.walkStart) / 0.45, 0, 1);
  if (appear <= 0) return;

  const sx     = VPX + F * st.xm / st.zm;
  const syFeet = VPY + F * CAMH / st.zm;
  const hPx    = F * p.heightM / st.zm;

  /* contact shadow */
  ctx.save();
  ctx.globalAlpha = 0.32 * appear * (1 - st.fall * 0.6);
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.ellipse(sx, syFeet + hPx * 0.008,
              hPx * 0.20 * (1 + st.fall * 1.4),
              hPx * 0.050 * (1 + st.fall * 0.5),
              0, 0, Math.PI*2);
  ctx.fill();
  ctx.restore();

  /* figure — apply flicker effects if in vanish phase */
  ctx.save();
  ctx.globalAlpha = appear;

  if (st.flickerT > 0){
    const vt = st.flickerT;
    const freq = 22;
    const mod = Math.floor(vt * freq) % 4;
    if (mod === 0){
      ctx.filter = 'brightness(3.0) saturate(0)';                 // wit
    } else if (mod === 1){
      const hue = (vt * 720) % 360;
      ctx.filter = 'brightness(1.7) hue-rotate(' + hue + 'deg) saturate(2.4)'; // kleuren
    } else if (mod === 2){
      ctx.filter = 'none';                                        // normaal
    } else {
      ctx.filter = 'brightness(1.4) saturate(0.3)';
      ctx.globalAlpha *= 0.22;                                    // bijna weg
    }
    // slight scale/offset jitter for that creepy feel
    const jitter = Math.sin(vt * 90) * hPx * 0.006;
    ctx.translate(sx + jitter, syFeet);
  } else {
    ctx.translate(sx, syFeet);
  }

  ctx.scale(hPx, hPx);
  drawFigure(p, t, st);
  ctx.restore();

  // reset filter just to be safe
  ctx.filter = 'none';
}

/* ============================================================
   PHASE LABEL
   ============================================================ */
function phaseLabelFor(t){
  if (!people.length) return '';
  const allDown = Math.max(...people.map(p => p.fallStart + p.fallDur));
  const anyVanishing = people.some(p => t > p.vanishStart && t < p.vanishStart + p.vanishDur);
  const allGone = people.every(p => t > p.vanishStart + p.vanishDur);

  if (t < 0.25)         return 'entering the room…';
  if (t < 6.0)          return 'gathered, talking quietly…';
  if (t < 8.5)          return 'something changes…';
  if (t < allDown + 0.6) return 'convulsion / collapsing…';
  if (anyVanishing)     return 'flickering…';
  if (allGone)          return '(G-> A -> SMILE:) [moet van de rechter]';
  return 'still…';
}

/* ============================================================
   MAIN LOOP
   ============================================================ */
function frame(now){
  if (startTime === null) startTime = now;
  const t = (now - startTime) / 1000;

  ctx.clearRect(0, 0, W, H);
  ctx.filter = 'none';
  drawRoom();

  const list = people.map(p => ({ p, st: personState(p, t) }));
  list.sort((a, b) => b.st.zm - a.st.zm);
  for (const item of list) drawPerson(item.p, t, item.st);

  phaseLabel.textContent = phaseLabelFor(t);
  clockLabel.textContent = 't = ' + t.toFixed(1) + 's';
  metaLabel.textContent  = people.length + ' people · ' +
                           (room ? (room.HALF_W * 2).toFixed(1) + 'm × ' + room.ZBACK.toFixed(1) + 'm' : '');

  // auto-restart
  if (sceneEnd !== null && t > sceneEnd){
    initScene();
    return;
  }

  requestAnimationFrame(frame);
}

/* ============================================================
   RESTART
   ============================================================ */
restartBtn.addEventListener('click', () => {
  initScene();
});

/* ============================================================
   BOOT
   ============================================================ */
initScene();
requestAnimationFrame(frame);

})();
</script>
